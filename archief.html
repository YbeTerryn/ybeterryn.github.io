 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .filter-section {

<body>
 <header class="sesjat-header">
  <p class="glyph">𓏟</p>
  <h1>Het Archief</h1>
  <p class="subtitle">Een verzameling zonlichtschuwe werken, voor wie zich echt niet kan weerhouden</p>
</header>
 
<header id="main-header">
  <nav id="main-nav"></nav>
</header>



<div class="filter-section">
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-bar" placeholder="Zoek in het archief...">
  </div>
</div>

<main class="grid" id="main-container">
</main>

<script src="data/stories.js"></script>

<script>
  function slugify(text) {
    return text?.toLowerCase()
        .replace(/[’']/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
}
  async function loadPreview(item, previewElement) {
    if (!previewElement || item.link) {
        return;
    }

    const slug = slugify(item.title);
    const paths = item.text
        ? [item.text, `texts/${slug}.html`]
        : [`texts/${slug}.html`];

    for (const path of [...new Set(paths)]) {
        try {
            const response = await fetch(path);

            if (!response.ok) {
                continue;
            }

            const html = await response.text();
            const parser = new DOMParser();
            const document = parser.parseFromString(html, 'text/html');

            const text = document.body.textContent
                .replace(/\s+/g, ' ')
                .trim();

            if (text) {
                previewElement.textContent =
                    text.length > 180
                        ? text.substring(0, 180).trimEnd() + '…'
                        : text;

                previewElement.hidden = false;
                return;
            }
        } catch (error) {
            console.error(`Preview kon niet geladen worden: ${path}`, error);
        }
    }

    previewElement.hidden = true;
}
window.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById("main-container");
    const searchInput = document.getElementById("searchInput");

    // 1. Bepaal de lijst op basis van de paginatitel
    let currentList = [];
    const pageTitle = document.title;
    
    if (pageTitle.includes("Offers")) {
        currentList = stories;
    } else if (pageTitle.includes("Archief")) {
        currentList = archiveStories;
    } else if (pageTitle.includes("Reviews")) {
        currentList = reviewStories;
    }

    // 2. De Render functie
    function render(filter = "") {
        container.innerHTML = "";
        const searchTerm = filter.toLowerCase();

        // Filter de lijst
        const filtered = currentList.filter(item => {
            return item.title.toLowerCase().includes(searchTerm) || 
                   (item.year && item.year.includes(searchTerm)) ||
                   (item.director && item.director.toLowerCase().includes(searchTerm)) ||
                   (item.date && item.date.toLowerCase().includes(searchTerm));
        });

filtered.slice().reverse().forEach(item => {

const isExternal = !!item.link;
const link = isExternal
    ? item.link
    : `story.html?id=${encodeURIComponent(item.id || slugify(item.title))}`;

    const card = document.createElement("a");
    card.className = "card";
    card.href = link;

    if (isExternal) {
        card.target = "_blank";
        card.rel = "noopener noreferrer";
    }

    card.innerHTML = `
        <div class="card-content">
            <img src="${item.image}" alt="${item.title}" class="card-image">
            <div class="card-text">
               <h2>${item.title}</h2>
<p class="meta">${item.year || item.date || ""}</p>

<p class="card-preview" data-preview hidden></p>

${item.director ? `<p class="meta-info"><em>${item.director}</em></p>` : ""}
            </div>
        </div>
    `;

  container.appendChild(card);
loadPreview(item, card.querySelector('[data-preview]'));
});

        // Lege status
        if (filtered.length === 0) {
            container.innerHTML = "<p class='no-results'>Niets gevonden...</p>";
        }
    }

    // 3. Event Listeners
    if (searchInput) {
        searchInput.addEventListener('input', (e) => render(e.target.value));
    }

    render(); // Start de eerste weergave
});
</script>

<script>
  // Menu ophalen
  fetch('nav.html').then(res => res.text()).then(data => {
    document.getElementById('main-nav').innerHTML = data;
  });
</script>

</body>
