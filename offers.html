<!DOCTYPE html>
<html lang="nl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJ1V2PREL6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MJ1V2PREL6');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Offers voor Sesjat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .filter-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: #d4af37;
            color: #353028;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        #filter-panel {
            display: none;
            margin: 20px auto;
            padding: 25px;
            background: #dcd6c9;
            border: 1px solid #c4bcae;
            border-radius: 12px;
            max-width: 400px;
            color: #353028;
            box-shadow: 0 4px 15px rgba(53, 48, 40, 0.1);
        }

        #filter-panel.show {
            display: block;
        }

        .filter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-row select {
            background: #f2ede4;
            color: #353028;
            border: 1px solid #c4bcae;
            padding: 8px;
            border-radius: 4px;
            flex: 1;
        }

        .icon-btn {
            background: #f2ede4;
            color: #353028;
            border: 1px solid #c4bcae;
            padding: 10px;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .icon-btn.active {
            background: #d4af37;
            color: #353028;
            border-color: #d4af37;
        }

        .search-wrapper {
            max-width: 400px;
            margin: 0 auto 20px auto;
            padding: 0 15px;
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #c4bcae;
            background: #f2ede4;
            color: #353028;
            box-sizing: border-box;
        }

        .rating {
            color: #d4af37;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .meta {
            color: #6d6455;
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .card {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-link-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .card-type-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.2rem;
            color: #d4af37;
            opacity: 0.6;
            z-index: 5;
        }

        .award-badge {
            position: relative;
            z-index: 11;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            padding: 0.35rem 0.6rem;
            border: 1px solid #d4af37;
            border-radius: 4px;
            background: transparent;
            color: #6d6455;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .award-badge i {
            color: #b89424;
        }

        .review-preview {
            margin-top: 12px;
            color: #6d6455;
            font-size: 0.95rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <header class="sesjat-header">
        <p class="glyph">𓇇</p>
        <h1>Offers voor Sesjat</h1>
        <p class="subtitle">Maandelijks een literair werk <br>Een offer voor de godin van het schrift</p>
    </header>

    <header id="main-header">
        <nav id="main-nav"></nav>
    </header>

    <div class="filter-section">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Offers zoeken...">
        </div>
    </div>

    <main class="grid" id="main-container"></main>

    <script src="data/stories.js"></script>

    <script>
        const slugify = (text) => text?.toLowerCase()
            .replace(/[’']/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '');

        function extractPreviewText(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const paragraphs = [...doc.querySelectorAll('p')];
            let previewText = '';

            for (const paragraph of paragraphs) {
                const text = paragraph.textContent.trim();
                if (!text) continue;
                previewText += (previewText ? ' ' : '') + text;
                if (previewText.length >= 350) break;
            }

            return previewText.trim();
        }

        async function loadPreview(item, previewElement) {
            if (!previewElement || item.link) return;

            const slug = slugify(item.title);
            const paths = item.text ? [item.text, `texts/${slug}.html`] : [`texts/${slug}.html`];

            for (const path of [...new Set(paths)]) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) continue;

                    const html = await response.text();
                    const previewText = extractPreviewText(html);

                    if (previewText) {
                        previewElement.textContent = previewText;
                        previewElement.hidden = false;
                        return;
                    }
                } catch (error) {
                    console.error(`Preview kon niet geladen worden: ${path}`, error);
                }
            }

            previewElement.hidden = true;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('main-container');
            const searchInput = document.getElementById('searchInput');

            const pageTitle = document.title.toLowerCase();
            let currentList = [];

            if (pageTitle.includes('offer')) {
                currentList = Array.isArray(stories) ? stories : [];
            } else if (pageTitle.includes('archief')) {
                currentList = Array.isArray(archiveStories) ? archiveStories : [];
            } else if (pageTitle.includes('review')) {
                currentList = Array.isArray(reviewStories) ? reviewStories : [];
            }

            function render(filter = '') {
                container.innerHTML = '';
                const searchTerm = filter.toLowerCase();

                const filtered = currentList.filter(item => {
                    const title = (item && item.title) ? item.title.toLowerCase() : '';
                    return title.includes(searchTerm) ||
                        (item.year && String(item.year).includes(searchTerm)) ||
                        (item.director && item.director.toLowerCase().includes(searchTerm)) ||
                        (item.date && item.date.toLowerCase().includes(searchTerm));
                });

                filtered.slice().reverse().forEach(item => {
                    const isExternal = !!item.link;
                    const slug = slugify(item.title);
                    const link = isExternal ? item.link : `story.html?id=${encodeURIComponent(item.id || slug)}`;
                    const displayImage = item.image || `Draft/${slug}.jpg`;

                    const card = document.createElement('article');
                    card.className = 'card';

                    card.innerHTML = `
                        <a href="${link}" class="card-link-overlay" ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}></a>
                        <div class="card-type-icon"><i class="fas fa-scroll"></i></div>
                        <div class="card-content">
                            <img src="${displayImage}" alt="${item.title || 'Offer'}" class="card-image" onerror="this.onerror=null; this.src='Draft/${slug}.png';">
                            <div class="card-text">
                                <h2>${item.title || ''}</h2>
                                <div class="meta">${item.year || item.date || ''}</div>
                                ${item.award ? `<div class="award-badge"><i class="fas fa-trophy" aria-hidden="true"></i><span>${item.award}</span></div>` : ''}
                                <div class="review-preview" data-preview hidden></div>
                                ${item.director ? `<div class="meta-info"><em>${item.director}</em></div>` : ''}
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                    loadPreview(item, card.querySelector('[data-preview]'));
                });

                if (filtered.length === 0) {
                    container.innerHTML = "<p class='no-results'>Niets gevonden...</p>";
                }
            }

            if (searchInput) {
                searchInput.addEventListener('input', (event) => render(event.target.value));
            }

            render();
        });

        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                const nav = document.getElementById('main-nav');
                if (nav) {
                    nav.innerHTML = data;
                }
            })
            .catch(error => console.error('Navigatie kon niet geladen worden:', error));
    </script>
</body>
</html>
